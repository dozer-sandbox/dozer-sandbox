# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# Kimi Code — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/kimi-code.json, which Dozer embeds).
schema: 2
kind: workload
id: moonshotai/kimi-code
displayName: Kimi Code
description: Moonshot AI's coding agent for the terminal (the successor to kimi-cli), here on an xAI API key.
author: Moonshot AI
sourceUrl: https://github.com/MoonshotAI/kimi-code
licenses:
- MIT
args:
  version:
    description: The Kimi Code release Dozer installs (its pin).
    default: 2.1.1
    pattern: '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?'
    buildArg: KIMI_CODE_VERSION
provides:
- com.dozersandbox/kimi-code@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.x.ai:443
      deny:
      - api.kimi.com:443
    dozer:
      model:
        id: model:kimi-code
        title: Talk to xAI
        summary: Kimi Code's model here (the xAI API, with your key) — needed for it to answer.
        phrase: talk to your AI model (xAI)
        hosts:
        - host: api.x.ai
          paths:
          - /v1/chat/completions
      update: []
      excluded: []
      quiet:
      - host: api.kimi.com
        reason: Kimi Code fetches Moonshot's public client settings (POST /coding/v1/client_configs, no credential) at each start and does without them when refused; no setting of its own stops it
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.kimi-code
- type: com.dozersandbox/install@1
  config:
    kind: npm
    package: '@moonshot-ai/kimi-code'
    binary: kimi
    needs_node: '22'
    npm_args:
    - --ignore-scripts
    integrity: sha512-xClqcnTQUKgKDbeOGPU78qcwxGzL8wA2rqWuOX3CLpyQ1/NhSX7jAh6hZo/JFwThSX8obkgef3uw/li5JaJNyw==
- type: com.dozersandbox/launch@1
  config:
    command:
    - kimi
    no_prompts_args:
    - --auto
    passthrough:
    - --version
    - -V
    - --help
    - -h
    - help
    - provider
    - session
    - doctor
    - export
    - upgrade
    - update
    - -p
    - --prompt
    env:
      KIMI_CODE_NO_AUTO_UPDATE: '1'
      KIMI_DISABLE_TELEMETRY: '1'
    state_env: {}
    first_run:
    - file: ~/.kimi-code/config.toml
      set:
        default_model: grok-build
        telemetry: false
        providers.xai.type: openai
        providers.xai.base_url: https://api.x.ai/v1
        providers.xai.api_key_env: XAI_API_KEY
        models.grok-build.provider: xai
        models.grok-build.model: grok-build-0.1
        models.grok-build.max_context_size: 256000
    # /workspace is trusted at the first start, as Claude Code's and Codex's are (the VM is the boundary), so the
    # session opens on the agent, not on its trust question.
    # Kimi Code keeps each folder's trust as a JSON record named for the folder (2.1.1: wd_<slug>_<sha256[:12]>).
    - file: ~/.kimi-code/workspace-trust/wd_workspace_c52ddf65534b
      format: json
      set:
        root: /workspace
        trustedAt: 1791936000000
    status: none
    resume:
    - --continue
    verify:
    - argv:
      - kimi
      - --version
      expect: ${{ kit.args.version }}
    check:
      argv:
      - kimi
      - -p
      - say ok
      expect: DOZ_FAKE_OK
      screen:
        # Its ready screen greets ("Welcome to Kimi Code!") above the prompt.
        allow:
        - Welcome to Kimi Code
        expect:
        - context
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: Kimi Code takes any OpenAI-compatible provider in its config.toml; Dozer names xAI's API (api_key_env XAI_API_KEY, so the key is read per request and never written there), model grok-build-0.1.
      checked: '2026-10-14'
    - kind: vendor-sign-in
      account: a Kimi account (kimi login, a device code) or a Moonshot platform key
      in_sandbox: false
      note: Kimi's own models need Moonshot's sign-in or key, which Dozer does not hold yet.
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: unknown
      reason: Kimi Code takes any OpenAI-compatible provider; OpenRouter was not checked
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: unknown
      reason: not checked against Kimi Code
      checked: '2026-10-14'
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: coding-agent
    categories:
    - coding-agent
    aliases:
    - kimi
    icon: kimi-code
    default_base: node
    platforms:
      glibc: true
      musl: false
    limits:
    - musl: true
      reason: Kimi Code needs Node 22.19 or later; Alpine's Node is older
    tags:
    - tag: headless
      level: verified
      notes:
      - kimi -p "…"
      evidence: 'make recipe-check: kimi -p "say ok" printed the stand-in''s answer and exited in a fresh try'
      checked: '2026-10-14'
    terms: Your xAI API key — a key from console.x.ai. Kimi's own models (a Kimi account or Moonshot key) are not offered yet.
- type: com.dozersandbox/guide@1
  config:
    intro: "Kimi Code is a coding agent with its own screen: the session on the left. Ask it to read, change and run the code in your folder."
    steps:
    - text: "Check it answers, without its screen."
      command: "kimi -p \"say ok\""
    - text: "Ask it something in its own screen — the session on the left."
    - text: "One task without its screen."
      command: "kimi -p \"list the files in this folder\""
    tips:
    - "Files it makes are in /workspace — your folder on the Mac."
    - "Restart its session from the session's ⋯ menu; End stops it."
    docs: https://github.com/MoonshotAI/kimi-code
