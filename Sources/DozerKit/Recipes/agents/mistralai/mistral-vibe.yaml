- type: com.dozersandbox/launch@1
  config:
    command:
    - vibe
    no_prompts_args:
    - --auto-approve
    - --trust
    passthrough:
    - --version
    - -v
    - --help
    - -h
    - --setup
    - --check-upgrade
    - update
    - mcp
    env:
      VIBE_ENABLE_TELEMETRY: 'false'
      VIBE_ENABLE_UPDATE_CHECKS: 'false'
      VIBE_ENABLE_AUTO_UPDATE: 'false'
    state_env: {}
    status: none
    resume:
    - --continue
    verify:
    - argv:
      - vibe
      - --version
      expect: ${{ kit.args.version }}
    check:
      argv:
      - vibe
      - --trust
      - --auto-approve
      - -p
      - say ok
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: 'Mistral Vibe''s own provider settings (VIBE_PROVIDERS, VIBE_MODELS), pointed at the chosen provider or gateway: an OpenAI-compatible base URL, or Anthropic''s Messages API. On xAI (the default) the model is grok-build-0.1. Mistral''s own keys Dozer does not offer yet.'
      checked: '2026-10-16'
    - kind: api-key
      provider: anthropic
      accounts:
      - api-key
      keys_page: https://console.anthropic.com/settings/keys
      note: 'Mistral Vibe through Anthropic: doz try mistral-vibe --provider anthropic (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: openai
      accounts:
      - openai-key
      keys_page: https://platform.openai.com/api-keys
      note: 'Mistral Vibe through OpenAI: doz try mistral-vibe --provider openai (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: google
      accounts:
      - key
      keys_page: https://aistudio.google.com/apikey
      note: 'Mistral Vibe through Google AI: doz try mistral-vibe --provider google (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: openrouter
      accounts:
      - key
      keys_page: https://openrouter.ai/keys
      note: 'Mistral Vibe through OpenRouter: doz try mistral-vibe --gateway openrouter (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: vercel-ai-gateway
      accounts:
      - key
      keys_page: https://vercel.com/docs/ai-gateway/authentication-and-byok
      note: 'Mistral Vibe through Vercel AI Gateway: doz try mistral-vibe --gateway vercel-ai-gateway (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: verified
      evidence: 'make recipe-check: its check turn through a stand-in OpenRouter (doz try with --gateway openrouter; models@1)'
      checked: '2026-10-16'
    - gateway: vercel-ai-gateway
      level: verified
      evidence: 'make recipe-check: its check turn through a stand-in Vercel AI Gateway (doz try with --gateway vercel-ai-gateway; models@1)'
      checked: '2026-10-16'
- type: com.dozersandbox/models@1
  config:
    default: xai
    shapes:
    - shape: openai-chat
      env:
        VIBE_PROVIDERS: '[{"name":"dozer","api_base":"${{ dozer.base_url }}","api_key_env_var":"OPENAI_API_KEY","api_style":"openai"}]'
        VIBE_MODELS: '[{"name":"${{ dozer.model }}","provider":"dozer","alias":"dozer"}]'
        VIBE_ACTIVE_MODEL: dozer
      key_env:
      - OPENAI_API_KEY
      source: https://docs.mistral.ai/vibe/code/cli/configuration
    - shape: anthropic-messages
      env:
        VIBE_PROVIDERS: '[{"name":"dozer","api_base":"${{ dozer.base_url }}","api_key_env_var":"ANTHROPIC_API_KEY","api_style":"anthropic"}]'
        VIBE_MODELS: '[{"name":"${{ dozer.model }}","provider":"dozer","alias":"dozer"}]'
        VIBE_ACTIVE_MODEL: dozer
      key_env:
      - ANTHROPIC_API_KEY
      source: https://docs.mistral.ai/vibe/code/cli/configuration
    models:
      xai: grok-build-0.1
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: coding-agent
    categories:
    - coding-agent
    aliases:
    - vibe
    icon: mistral-vibe
    default_base: debian
    platforms:
      glibc: true
      musl: false
    tags:
    - tag: headless
      level: verified
      notes:
      - vibe --trust --auto-approve -p "…"
      evidence: 'make recipe-check: vibe -p "say ok" printed the stand-in''s answer and exited in a fresh try'
      checked: '2026-10-14'
    terms: Your API key of the provider or gateway you choose (xAI by default).
- type: com.dozersandbox/guide@1
  config:
    intro: "Mistral Vibe is a coding agent with its own screen: the session on the left. Ask it to read, change and run the code in your folder."
    steps:
    - text: "Check it answers, without its screen."
      command: "vibe --trust --auto-approve -p \"say ok\""
    - text: "Ask it something in its own screen — the session on the left."
    - text: "One task without its screen."
      command: "vibe --trust --auto-approve -p \"list the files in this folder\""
    tips:
    - "Files it makes are in /workspace — your folder on the Mac."
    - "Restart its session from the session's ⋯ menu; End stops it."
    docs: https://github.com/mistralai/mistral-vibe
