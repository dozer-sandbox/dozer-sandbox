# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# Mistral Vibe — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/mistral-vibe.json, which Dozer embeds).
schema: 2
kind: workload
id: mistralai/mistral-vibe
displayName: Mistral Vibe
description: Mistral AI's coding agent for the terminal, on the key of the provider or gateway you choose (xAI by default; Vibe's own provider settings).
author: Mistral AI
sourceUrl: https://github.com/mistralai/mistral-vibe
licenses:
- Apache-2.0
args:
  version:
    description: The Mistral Vibe release Dozer installs (its pin).
    default: 2.26.1
    pattern: '[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?'
    buildArg: MISTRAL_VIBE_VERSION
provides:
- com.dozersandbox/mistral-vibe@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.anthropic.com:443
      - api.openai.com:443
      - api.x.ai:443
      - generativelanguage.googleapis.com:443
      - openrouter.ai:443
      - ai-gateway.vercel.sh:443
    dozer:
      model:
        id: model:mistral-vibe
        title: Talk to its model provider
        summary: Mistral Vibe's model — the provider or gateway its key is for (Anthropic, OpenAI, xAI, Google AI, OpenRouter or Vercel AI Gateway), with an API key. Needed for Mistral Vibe to answer.
        phrase: talk to your AI model
        hosts:
        - host: api.anthropic.com
          reason: Anthropic — when the sandbox's key is Anthropic's
        - host: api.openai.com
          reason: OpenAI — when the sandbox's key is OpenAI's
        - host: api.x.ai
          paths:
          - /v1/chat/completions
          reason: xAI — when the sandbox's key is xAI's
        - host: generativelanguage.googleapis.com
          reason: Google AI — when the sandbox's key is Google AI's
        - host: openrouter.ai
          reason: OpenRouter — when the sandbox's key is OpenRouter's
        - host: ai-gateway.vercel.sh
          reason: Vercel AI Gateway — when the sandbox's key is Vercel AI Gateway's
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.vibe
- type: com.dozersandbox/install@1
  config:
    kind: pypi
    package: mistral-vibe
    binary: vibe
