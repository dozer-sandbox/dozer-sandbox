# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# OpenCode — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/opencode.json, which Dozer embeds).
schema: 2
kind: workload
id: anomalyco/opencode
displayName: OpenCode
description: An open-source coding agent for the terminal that works with many model providers, here on an xAI API key.
author: Anomaly
sourceUrl: https://github.com/anomalyco/opencode
licenses:
- MIT
args:
  version:
    description: The OpenCode release Dozer installs (its pin).
    default: 1.19.0
    pattern: '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?'
    buildArg: OPENCODE_VERSION
provides:
- com.dozersandbox/opencode@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.x.ai:443
    dozer:
      model:
        id: model:opencode
        title: Talk to xAI
        summary: OpenCode's model here (the xAI API, with an API key) — needed for OpenCode to answer.
        phrase: talk to your AI model (xAI)
        hosts:
        - host: api.x.ai
          paths:
          - /v1/models
          - /v1/chat/completions
          - /v1/responses
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.local/share/opencode
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.config/opencode
- type: com.docker.sandbox/agent-context@1
  config:
    directory: /home/agent/.agents/skills/dozer
    filename: SKILL.md
    dozer:
      kind: skill
- type: com.dozersandbox/install@1
  config:
    kind: npm-platform-binary
    package: opencode-ai
    platform_package: opencode-linux-arm64
    payload: bin/opencode
    binary: opencode
    integrity: sha512-XD1qcVN4jEiaYHqtx40p8cEPJxBc1mcB99ksgQ81akZsGGwcNFyG6GH857jVEplbGgdzWiWxDCrSii56sHjmRQ==
- type: com.dozersandbox/launch@1
  config:
    command:
    - opencode
    no_prompts_args: []
    passthrough:
    - --version
    - -v
    - --help
    - -h
    - auth
    - models
    - upgrade
    - uninstall
    - mcp
    - debug
    - stats
    env:
      OPENCODE_DISABLE_AUTOUPDATE: '1'
      OPENCODE_DISABLE_SHARE: '1'
      OPENCODE_DISABLE_LSP_DOWNLOAD: '1'
      OPENCODE_DISABLE_MODELS_FETCH: '1'
    state_env: {}
    first_run:
    - file: ~/.config/opencode/opencode.json
      set:
        model: xai/grok-build-0.1
        autoupdate: false
        share: disabled
    - file: ~/.config/opencode/package-lock.json
      set:
        packages:
          '':
            dependencies:
              '@opencode-ai/plugin': '*'
    - file: ~/.config/opencode/node_modules/.package-lock.json
      set:
        lockfileVersion: 3
    status: none
    resume:
    - --continue
    verify:
    - argv:
      - opencode
      - --version
      expect: ${{ kit.args.version }}
    check:
      argv:
      - opencode
      - run
      - say ok
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: OpenCode works with many providers; Dozer offers it on an xAI key (XAI_API_KEY, model xai/grok-build-0.1) for now.
      checked: '2026-10-14'
    - kind: vendor-sign-in
      account: an OpenCode Zen, Anthropic, OpenAI or GitHub Copilot account
      in_sandbox: false
      note: OpenCode can sign in itself (opencode auth login); that sign-in would live in the sandbox's own state, not on the Mac — Dozer does not offer it yet.
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: documented
      shape: openai-chat
      how:
        env:
          OPENROUTER_API_KEY: ${{ dozer.placeholder }}
        model_args:
        - --model
        - openrouter/${{ dozer.model }}
      notes:
      - OpenRouter is one of OpenCode's built-in providers (OPENROUTER_API_KEY)
      source: https://opencode.ai/docs/providers/
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: documented
      shape: openai-chat
      how:
        env:
          AI_GATEWAY_API_KEY: ${{ dozer.placeholder }}
        model_args:
        - --model
        - vercel/${{ dozer.model }}
      notes:
      - Vercel AI Gateway is one of OpenCode's built-in providers (AI_GATEWAY_API_KEY)
      source: https://opencode.ai/docs/providers/
      checked: '2026-10-14'
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: coding-agent
    categories:
    - coding-agent
    icon: opencode
    default_base: debian
    platforms:
      glibc: true
      musl: false
    limits:
    - musl: true
      reason: Dozer installs OpenCode's glibc build; its musl build is a separate package, not used yet
    tags:
    - tag: headless
      level: verified
      notes:
      - opencode run "…"
      evidence: 'make recipe-check: opencode run "say ok" printed the stand-in''s answer and exited in a fresh try'
      checked: '2026-10-14'
    terms: Your xAI API key — a key from console.x.ai.
- type: com.dozersandbox/guide@1
  config:
    intro: "OpenCode is a coding agent with its own screen: the session on the left. Ask it to read, change and run the code in your folder."
    steps:
    - text: "Check it answers, without its screen."
      command: "opencode run \"say ok\""
    - text: "Ask it something in its own screen — the session on the left."
    - text: "One task without its screen."
      command: "opencode run \"list the files in this folder\""
    tips:
    - "Files it makes are in /workspace — your folder on the Mac."
    - "Restart its session from the session's ⋯ menu; End stops it."
    docs: https://github.com/anomalyco/opencode
