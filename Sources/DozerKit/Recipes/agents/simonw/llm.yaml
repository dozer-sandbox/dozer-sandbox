- type: com.dozersandbox/launch@1
  config:
    command:
    - llm
    no_prompts_args: []
    passthrough:
    - '--version'
    - '--help'
    - '-h'
    - keys
    - models
    - plugins
    - logs
    env: {}
    state_env: {}
    session: shell
    status: none
    verify:
    - argv:
      - llm
      - '--version'
      expect: '${{ kit.args.version }}'
    check:
      argv:
      - llm
      - say ok
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: 'llm talks to xAI through the llm-grok plugin (installed with it) and to OpenAI through its own; Dozer sets LLM_MODEL to the chosen model (grok-4-1-fast on xAI; or -m). Other plugins are not in the image.'
      checked: '2026-10-14'
    - kind: api-key
      provider: openai
      accounts:
      - openai-key
      keys_page: https://platform.openai.com/api-keys
      note: 'llm through OpenAI: doz try llm --provider openai (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: 'no'
      reason: 'its plugin for OpenRouter is not installed in this image (llm install needs PyPI at run time)'
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: 'no'
      reason: 'its plugin for Vercel AI Gateway is not installed in this image (llm install needs PyPI at run time)'
      checked: '2026-10-14'
- type: com.dozersandbox/models@1
  config:
    default: xai
    native:
    - source: openai
      env:
        LLM_MODEL: '${{ dozer.model }}'
    - source: xai
      env:
        LLM_MODEL: '${{ dozer.model }}'
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: ai-tool
    categories:
    - terminal-tool
    icon: llm
    default_base: debian
    platforms:
      glibc: true
      musl: false
    tags:
    - tag: headless
      level: verified
      notes:
      - llm -m MODEL PROMPT
      evidence: 'A2 VM proof: its check turn answered DOZ_FAKE_OK through the fake provider (make recipe-check; probes/617-*/recipes/llm)'
      checked: '2026-10-14'
    terms: Your xAI or OpenAI API key (xAI by default). llm install (more plugins) needs PyPI, which Dozer does not offer at run time yet.
- type: com.dozersandbox/guide@1
  config:
    intro: "llm prompts a model from the command line and logs every prompt and answer to SQLite. It answers in your shell and exits; `llm chat` is its chat."
    steps:
    - text: "Check it answers."
      command: "llm \"say ok\""
    - text: "Pipe text in with a system prompt."
      command: "echo \"Dozer runs each agent in its own VM\" | llm -s \"summarise this in five words\""
    - text: "See the models it knows."
      command: "llm models"
    - text: "See your last prompt and answer."
      command: "llm logs -n 1"
    tips:
    - "`llm -c \"and now?\"` continues the last conversation."
    - "`llm chat` keeps a conversation going until you type `exit`."
    - "The model is `LLM_MODEL`, set for the key you chose; `-m MODEL` picks another."
    docs: https://llm.datasette.io
