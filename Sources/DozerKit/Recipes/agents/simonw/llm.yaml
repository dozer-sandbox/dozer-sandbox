# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# llm — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/llm.json, which Dozer embeds).
schema: 2
kind: workload
id: simonw/llm
displayName: llm
description: Simon Willison's command-line tool for prompting models, logging to SQLite, embeddings and tools; on an xAI or OpenAI key.
author: Simon Willison
sourceUrl: https://github.com/simonw/llm
licenses:
- Apache-2.0
args:
  version:
    description: The llm release Dozer installs (its pin).
    default: '0.36'
    pattern: '[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?'
    buildArg: LLM_VERSION
provides:
- com.dozersandbox/llm@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.openai.com:443
      - api.x.ai:443
    dozer:
      model:
        id: model:llm
        title: Talk to its model provider
        summary: llm's model — the provider or gateway its key is for (OpenAI or xAI), with an API key. Needed for llm to answer.
        phrase: talk to your AI model
        hosts:
        - host: api.openai.com
          reason: OpenAI — when the sandbox's key is OpenAI's
        - host: api.x.ai
          reason: xAI — when the sandbox's key is xAI's
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.config/io.datasette.llm
- type: com.dozersandbox/install@1
  config:
    kind: pypi
    package: llm
    binary: llm
