# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# MiMo Code — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/mimo-code.json, which Dozer embeds).
# Licence: MIT for the code, plus Xiaomi's "Use Restrictions". The owner's reading (2026-10-14): installing it for a
# user in their own sandbox is not a competing or restricted use — so it is a recipe. Its usage analytics stay off.
schema: 2
kind: workload
id: xiaomi/mimo-code
displayName: MiMo Code
description: Xiaomi's coding agent for the terminal (an OpenCode derivative), here on an xAI API key.
author: Xiaomi
sourceUrl: https://mimo.xiaomi.com
licenses:
- MIT
args:
  version:
    description: The MiMo Code release Dozer installs (its pin).
    default: 0.1.15
    pattern: '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?'
    buildArg: MIMO_CODE_VERSION
provides:
- com.dozersandbox/mimo-code@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.x.ai:443
    dozer:
      model:
        id: model:mimo-code
        title: Talk to xAI
        summary: MiMo Code's model here (the xAI API, with your key) — needed for it to answer.
        phrase: talk to your AI model (xAI)
        hosts:
        - host: api.x.ai
          paths:
          - /v1/responses
          - /v1/chat/completions
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.local/share/mimocode
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.config/mimocode
- type: com.dozersandbox/install@1
  config:
    kind: npm-platform-binary
    package: '@mimo-ai/cli'
    platform_package: '@mimo-ai/mimocode-linux-arm64'
    payload: bin/mimo
    binary: mimo
    integrity: sha512-x5x7cRstiRlSuXIPUcXs8UTH5JxbJwrd2XwKlX4Z8bxuXf8kxu7udm0qMuti7QRQ3U2vY/G4uTSZ5B1Vz3S4yw==
- type: com.dozersandbox/launch@1
  config:
    command:
    - mimo
    # Its --dangerously-skip-permissions asks again on a terminal ("No, exit" first); its variable does not.
    no_prompts_args: []
    no_prompts_env:
      MIMOCODE_DANGEROUSLY_SKIP_PERMISSIONS: '1'
    passthrough:
    - --version
    - -v
    - --help
    - -h
    - run
    - auth
    - models
    - upgrade
    - mcp
    - stats
    env:
      MIMOCODE_ENABLE_ANALYSIS: 'false'
      MIMOCODE_DISABLE_MODELS_FETCH: '1'
      MIMOCODE_DISABLE_AUTOUPDATE: '1'
      MIMOCODE_DISABLE_SHARE: '1'
      MIMOCODE_DISABLE_LSP_DOWNLOAD: '1'
    state_env: {}
    first_run:
    - file: ~/.config/mimocode/mimocode.json
      set:
        model: xai/grok-build-0.1
        autoupdate: false
        share: disabled
    # /workspace is trusted at the first start, as Claude Code's and Codex's are (the VM is the boundary), so the
    # session opens on the agent, not on its trust question.
    - file: ~/.local/share/mimocode/trusted-workspaces.json
      set:
        version: 1
        trustedPaths:
        - /workspace
    status: none
    resume:
    - --continue
    verify:
    - argv:
      - mimo
      - --version
      expect: ${{ kit.args.version }}
    check:
      argv:
      - mimo
      - run
      - -m
      - xai/grok-build-0.1
      - say ok
      expect: DOZ_FAKE_OK
      screen:
        # Its ready screen shows a rotating tip; one is about Xiaomi's own (ended) free service and its /login.
        allow:
        - Tip .*(/login|sign in)
        expect:
        - Type your message
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: MiMo Code's xai provider reads XAI_API_KEY, model xai/grok-build-0.1. Its MiMo Platform and ChatGPT sign-ins are not offered.
      checked: '2026-10-14'
    - kind: vendor-sign-in
      account: a MiMo Platform account (Xiaomi)
      in_sandbox: false
      note: MiMo's own models need its sign-in; Dozer does not offer it yet.
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: unknown
      reason: MiMo Code has OpenCode's providers; OpenRouter was not checked
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: unknown
      reason: not checked against MiMo Code
      checked: '2026-10-14'
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: coding-agent
    categories:
    - coding-agent
    aliases:
    - mimo
    - mimocode
    icon: mimo-code
    default_base: debian
    platforms:
      glibc: true
      musl: false
    limits:
    - musl: true
      reason: Dozer installs MiMo Code's glibc build; its musl build is a separate package, not used yet
    tags:
    - tag: headless
      level: verified
      notes:
      - mimo run -m xai/grok-build-0.1 "…"
      evidence: 'make recipe-check: mimo run "say ok" printed the stand-in''s answer and exited in a fresh try'
      checked: '2026-10-14'
    terms: Your xAI API key — a key from console.x.ai. MiMo Code comes with Xiaomi's use restrictions beside its MIT licence; its usage analytics are off.
- type: com.dozersandbox/guide@1
  config:
    intro: "MiMo Code is a coding agent with its own screen: the session on the left. Ask it to read, change and run the code in your folder."
    steps:
    - text: "Check it answers, without its screen."
      command: "mimo run -m xai/grok-build-0.1 \"say ok\""
    - text: "Ask it something in its own screen — the session on the left."
    - text: "One task without its screen."
      command: "mimo run -m xai/grok-build-0.1 \"list the files in this folder\""
    tips:
    - "Files it makes are in /workspace — your folder on the Mac."
    - "Restart its session from the session's ⋯ menu; End stops it."
    docs: https://mimo.xiaomi.com
