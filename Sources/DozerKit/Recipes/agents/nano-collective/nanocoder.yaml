# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# Nanocoder — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/nanocoder.json, which Dozer embeds).
schema: 2
kind: workload
id: nano-collective/nanocoder
displayName: Nanocoder
description: The Nano Collective's local-first coding agent for the terminal, here on an xAI API key.
author: Nano Collective
sourceUrl: https://github.com/Nano-Collective/nanocoder
licenses:
- MIT
args:
  version:
    description: The Nanocoder release Dozer installs (its pin).
    default: 1.31.0
    pattern: '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?'
    buildArg: NANOCODER_VERSION
provides:
- com.dozersandbox/nanocoder@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.x.ai:443
      deny:
      - models.dev:443
    dozer:
      model:
        id: model:nanocoder
        title: Talk to xAI
        summary: Nanocoder's model here (the xAI API, with your key) — needed for it to answer.
        phrase: talk to your AI model (xAI)
        hosts:
        - host: api.x.ai
          paths:
          - /v1/chat/completions
      update: []
      excluded: []
      quiet:
      - host: models.dev
        reason: Nanocoder reads the public models.dev catalogue for a model's context size and prices (no setting turns it off); it does without it when refused
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.config/nanocoder
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.local/share/nanocoder
- type: com.dozersandbox/install@1
  config:
    kind: npm
    package: '@nanocollective/nanocoder'
    binary: nanocoder
    needs_node: '22'
    npm_args:
    - --ignore-scripts
    integrity: sha512-EyJn8aO7YFKDA+IYyUmSN9/XHCqgBfrYKHE61iKMf6B4ASY9GDd8VHG0J09w0bd/V5kQdUQzHszk0fiCv8fRHQ==
- type: com.dozersandbox/launch@1
  config:
    command:
    - nanocoder
    no_prompts_args:
    - --mode
    - yolo
    passthrough:
    - --version
    - -v
    - --help
    - -h
    - run
    - init
    - review
    - config
    - skills
    - completion
    env:
      NANOCODER_CONTEXT_LIMIT: '256000'
    state_env: {}
    first_run:
    - file: ~/.config/nanocoder/agents.config.json
      set:
        nanocoder.providers:
        - name: xAI
          sdkProvider: openai-compatible
          baseUrl: https://api.x.ai/v1
          apiKey: ${XAI_API_KEY}
          models:
          - grok-build-0.1
    # /workspace is trusted at the first start, as Claude Code's and Codex's are (the VM is the boundary), so the
    # session opens on the agent, not on its trust question.
    - file: ~/.config/nanocoder/nanocoder-preferences.json
      set:
        trustedDirectories:
        - /workspace
    status: none
    verify:
    - argv:
      - nanocoder
      - --version
      expect: ${{ kit.args.version }}
    check:
      argv:
      - nanocoder
      - run
      - say ok
      - --trust-directory
      - --plain
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: 'An OpenAI-compatible provider in ~/.config/nanocoder/agents.config.json on xAI''s API; its apiKey is the reference ${XAI_API_KEY}, which Nanocoder expands from the environment each run, so the key is never written there. Model grok-build-0.1.'
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: unknown
      reason: Nanocoder takes any OpenAI-compatible provider; OpenRouter was not checked
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: unknown
      reason: not checked against Nanocoder
      checked: '2026-10-14'
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: coding-agent
    categories:
    - coding-agent
    icon: nanocoder
    default_base: node
    platforms:
      glibc: true
      musl: false
    limits:
    - musl: true
      reason: not checked on Alpine
    tags:
    - tag: headless
      level: verified
      notes:
      - nanocoder run "…" --trust-directory --plain
      evidence: 'make recipe-check: nanocoder run "say ok" printed the stand-in''s answer and exited in a fresh try'
      checked: '2026-10-14'
    terms: Your xAI API key — a key from console.x.ai.
- type: com.dozersandbox/guide@1
  config:
    intro: "Nanocoder is a coding agent with its own screen: the session on the left. Ask it to read, change and run the code in your folder."
    steps:
    - text: "Check it answers, without its screen."
      command: "nanocoder run \"say ok\" --trust-directory --plain"
    - text: "Ask it something in its own screen — the session on the left."
    - text: "One task without its screen."
      command: "nanocoder run \"list the files in this folder\" --trust-directory --plain"
    tips:
    - "Files it makes are in /workspace — your folder on the Mac."
    - "Restart its session from the session's ⋯ menu; End stops it."
    docs: https://github.com/Nano-Collective/nanocoder
