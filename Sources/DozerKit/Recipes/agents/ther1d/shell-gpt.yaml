- type: com.dozersandbox/launch@1
  config:
    command:
    - sgpt
    no_prompts_args: []
    passthrough:
    - '--version'
    - '--help'
    env: {}
    state_env: {}
    session: shell
    status: none
    verify:
    - argv:
      - /opt/shell-gpt/venv/bin/pip
      - show
      - shell-gpt
      expect: 'Version: ${{ kit.args.version }}'
    check:
      argv:
      - sgpt
      - say ok
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: ShellGPT speaks OpenAI's API; Dozer points it at the chosen provider's or gateway's (API_BASE_URL) and puts the key's placeholder under OPENAI_API_KEY too. On xAI (the default) the model is grok-4-1-fast (DEFAULT_MODEL; doz try --model, or sgpt --model).
      checked: '2026-10-14'
    - kind: api-key
      provider: openai
      accounts:
      - openai-key
      keys_page: https://platform.openai.com/api-keys
      note: 'ShellGPT through OpenAI: doz try shell-gpt --provider openai (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
    - kind: api-key
      provider: google
      accounts:
      - key
      keys_page: https://aistudio.google.com/apikey
      note: 'ShellGPT through Google AI: doz try shell-gpt --provider google (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
    - kind: api-key
      provider: openrouter
      accounts:
      - key
      keys_page: https://openrouter.ai/keys
      note: 'ShellGPT through OpenRouter: doz try shell-gpt --gateway openrouter (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
    - kind: api-key
      provider: vercel-ai-gateway
      accounts:
      - key
      keys_page: https://vercel.com/docs/ai-gateway/authentication-and-byok
      note: 'ShellGPT through Vercel AI Gateway: doz try shell-gpt --gateway vercel-ai-gateway (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: verified
      shape: openai-chat
      endpoint: v1
      how:
        env:
          API_BASE_URL: '${{ dozer.gateway.endpoint.v1 }}'
          DEFAULT_MODEL: '${{ dozer.model }}'
      evidence: 'make recipe-check: its check turn through a stand-in OpenRouter (doz try with --gateway openrouter; models@1)'
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: verified
      shape: openai-chat
      endpoint: v1
      how:
        env:
          API_BASE_URL: '${{ dozer.gateway.endpoint.v1 }}'
          DEFAULT_MODEL: '${{ dozer.model }}'
      evidence: 'make recipe-check: its check turn through a stand-in Vercel AI Gateway (doz try with --gateway vercel-ai-gateway; models@1)'
      checked: '2026-10-14'
- type: com.dozersandbox/models@1
  config:
    default: xai
    shapes:
    - shape: openai-chat
      env:
        API_BASE_URL: '${{ dozer.base_url }}'
        DEFAULT_MODEL: '${{ dozer.model }}'
      key_env:
      - OPENAI_API_KEY
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: ai-tool
    categories:
    - terminal-tool
    icon: shell-gpt
    default_base: debian
    platforms:
      glibc: true
      musl: false
    tags:
    - tag: headless
      level: verified
      notes:
      - sgpt PROMPT
      evidence: 'A2 VM proof: its check turn answered DOZ_FAKE_OK through the fake provider (make recipe-check; probes/617-*/recipes/shell-gpt)'
      checked: '2026-10-14'
    terms: Your API key of the provider or gateway you choose (xAI by default).
- type: com.dozersandbox/guide@1
  config:
    intro: "ShellGPT (`sgpt`) answers questions and turns a request into a shell command. It answers in your shell and exits."
    steps:
    - text: "Check it answers."
      command: "sgpt \"say ok\""
    - text: "Ask for code only."
      command: "sgpt --code \"a python function that adds two numbers\""
    - text: "A conversation that remembers — say something, then ask about it."
      command: "sgpt --chat demo \"my name is Ada\""
    - text: "Ask about it."
      command: "sgpt --chat demo \"what is my name?\""
    tips:
    - "`sgpt --shell \"find the five largest files here\"` suggests a command and asks before it runs it."
    - "`sgpt --repl temp` opens a chat in the terminal."
    - "The model is `DEFAULT_MODEL`, set for the key you chose."
    docs: https://github.com/TheR1D/shell_gpt
