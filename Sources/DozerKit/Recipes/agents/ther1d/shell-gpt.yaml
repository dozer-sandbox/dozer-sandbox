# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# ShellGPT — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/shell-gpt.json, which Dozer embeds).
schema: 2
kind: workload
id: ther1d/shell-gpt
displayName: ShellGPT
description: A command-line assistant that answers questions and turns requests into shell commands (sgpt), on an xAI, OpenAI, Google AI, OpenRouter or Vercel AI Gateway key.
author: TheR1D
sourceUrl: https://github.com/TheR1D/shell_gpt
licenses:
- MIT
args:
  version:
    description: The ShellGPT release Dozer installs (its pin).
    default: '1.5.1'
    pattern: '[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?'
    buildArg: SHELL_GPT_VERSION
provides:
- com.dozersandbox/shell-gpt@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.openai.com:443
      - api.x.ai:443
      - generativelanguage.googleapis.com:443
      - openrouter.ai:443
      - ai-gateway.vercel.sh:443
    dozer:
      model:
        id: model:shell-gpt
        title: Talk to its model provider
        summary: ShellGPT's model — the provider or gateway its key is for (OpenAI, xAI, Google AI, OpenRouter or Vercel AI Gateway), with an API key. Needed for ShellGPT to answer.
        phrase: talk to your AI model
        hosts:
        - host: api.openai.com
          reason: OpenAI — when the sandbox's key is OpenAI's
        - host: api.x.ai
          reason: xAI — when the sandbox's key is xAI's
        - host: generativelanguage.googleapis.com
          reason: Google AI — when the sandbox's key is Google AI's
        - host: openrouter.ai
          reason: OpenRouter — when the sandbox's key is OpenRouter's
        - host: ai-gateway.vercel.sh
          reason: Vercel AI Gateway — when the sandbox's key is Vercel AI Gateway's
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.config/shell_gpt
- type: com.dozersandbox/install@1
  config:
    kind: pypi
    package: shell-gpt
    binary: sgpt
    integrity: sha512-wtiD9Hjrac0l5s1jfrEzncC0o7Wl61cJM/22qeBHKya9eYsJ7cxBk0wxRRXilNbON/2lrJaM1onMNWApQcVBNg==
    requirements:
    - annotated-doc==0.0.5 --hash=sha256:117bac03a25ede5df5440e855b32d556049ca169ead221505badf432fed4b101
    - annotated-types==0.8.0 --hash=sha256:f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0
    - anyio==4.15.1 --hash=sha256:6152fdbbf9a77fdec97731721bebf7c4c44f7c29b424b0065826173efc7ed101
    - certifi==2026.7.22 --hash=sha256:62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775
