# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# smolagents — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/smolagents.json, which Dozer embeds).
schema: 2
kind: workload
id: huggingface/smolagents
displayName: smolagents
description: Hugging Face's library and CLI for agents that write and run Python code (smolagent), on an xAI, OpenAI, Google AI, OpenRouter or Vercel AI Gateway key.
author: Hugging Face
sourceUrl: https://github.com/huggingface/smolagents
licenses:
- Apache-2.0
args:
  version:
    description: The smolagents release Dozer installs (its pin).
    default: '1.26.0'
    pattern: '[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?'
    buildArg: SMOLAGENTS_VERSION
provides:
- com.dozersandbox/smolagents@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.openai.com:443
      - api.x.ai:443
      - generativelanguage.googleapis.com:443
      - openrouter.ai:443
      - ai-gateway.vercel.sh:443
    dozer:
      model:
        id: model:smolagents
        title: Talk to its model provider
        summary: smolagents's model — the provider or gateway its key is for (OpenAI, xAI, Google AI, OpenRouter or Vercel AI Gateway), with an API key. Needed for smolagents to answer.
        phrase: talk to your AI model
        hosts:
        - host: api.openai.com
          reason: OpenAI — when the sandbox's key is OpenAI's
        - host: api.x.ai
          reason: xAI — when the sandbox's key is xAI's
        - host: generativelanguage.googleapis.com
          reason: Google AI — when the sandbox's key is Google AI's
        - host: openrouter.ai
          reason: OpenRouter — when the sandbox's key is OpenRouter's
        - host: ai-gateway.vercel.sh
          reason: Vercel AI Gateway — when the sandbox's key is Vercel AI Gateway's
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.cache/huggingface
- type: com.dozersandbox/install@1
  config:
    kind: pypi
    package: smolagents
