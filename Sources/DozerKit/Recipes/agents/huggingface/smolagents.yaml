- type: com.dozersandbox/launch@1
  config:
    command:
    - smolagent
    no_prompts_args: []
    passthrough:
    - '--help'
    - '-h'
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    state_env: {}
    session: shell
    status: none
    verify:
    - argv:
      - /opt/smolagents/venv/bin/pip
      - show
      - smolagents
      expect: 'Version: ${{ kit.args.version }}'
    check:
      argv:
      - smolagent
      - say ok
      - '--model-type'
      - OpenAIModel
      - '--model-id'
      - '${{ dozer.model }}'
      - '--api-base'
      - '${{ dozer.base_url }}'
      expect: DOZ_FAKE_OK
      timeout: 300
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: 'smolagent speaks to the chosen source through its OpenAI-compatible model: --model-type OpenAIModel --model-id "$DOZ_MODEL" --api-base "$OPENAI_BASE_URL" (the key under OPENAI_API_KEY). Its Hugging Face inference default is not offered.'
      checked: '2026-10-14'
    - kind: api-key
      provider: openai
      accounts:
      - openai-key
      keys_page: https://platform.openai.com/api-keys
      note: 'smolagents through OpenAI: doz try smolagents --provider openai (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
    - kind: api-key
      provider: google
      accounts:
      - key
      keys_page: https://aistudio.google.com/apikey
      note: 'smolagents through Google AI: doz try smolagents --provider google (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
    - kind: api-key
      provider: openrouter
      accounts:
      - key
      keys_page: https://openrouter.ai/keys
      note: 'smolagents through OpenRouter: doz try smolagents --gateway openrouter (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
    - kind: api-key
      provider: vercel-ai-gateway
      accounts:
      - key
      keys_page: https://vercel.com/docs/ai-gateway/authentication-and-byok
      note: 'smolagents through Vercel AI Gateway: doz try smolagents --gateway vercel-ai-gateway (or choose it in the try setup); the model with --model.'
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: verified
      shape: openai-chat
      endpoint: v1
      how:
        env:
          OPENAI_BASE_URL: '${{ dozer.gateway.endpoint.v1 }}'
          DOZ_MODEL: '${{ dozer.model }}'
      evidence: 'make recipe-check: its check turn through a stand-in OpenRouter (doz try with --gateway openrouter; models@1)'
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: verified
      shape: openai-chat
      endpoint: v1
      how:
        env:
          OPENAI_BASE_URL: '${{ dozer.gateway.endpoint.v1 }}'
          DOZ_MODEL: '${{ dozer.model }}'
      evidence: 'make recipe-check: its check turn through a stand-in Vercel AI Gateway (doz try with --gateway vercel-ai-gateway; models@1)'
      checked: '2026-10-14'
- type: com.dozersandbox/models@1
  config:
    default: xai
    shapes:
    - shape: openai-chat
      env:
        OPENAI_BASE_URL: '${{ dozer.base_url }}'
        DOZ_MODEL: '${{ dozer.model }}'
      key_env:
      - OPENAI_API_KEY
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: ai-tool
    categories:
    - framework
    icon: smolagents
    default_base: debian
    platforms:
      glibc: true
      musl: false
    tags:
    - tag: headless
      level: verified
      notes:
      - smolagent PROMPT --model-type OpenAIModel --model-id MODEL --api-base URL
      evidence: 'A2 VM proof: its check turn answered DOZ_FAKE_OK through the fake provider (make recipe-check; probes/617-*/recipes/smolagents)'
      checked: '2026-10-14'
    terms: Your API key of the provider or gateway you choose (xAI by default). Its web agent (webagent) needs a browser in the image, which Dozer does not offer yet.
- type: com.dozersandbox/guide@1
  config:
    intro: "smolagents is Hugging Face's library for agents that write and run Python; `smolagent` runs one task from your shell."
    steps:
    - text: "Check it answers."
      command: "smolagent \"say ok\" --model-type OpenAIModel --model-id \"$DOZ_MODEL\" --api-base \"$OPENAI_BASE_URL\""
    - text: "Give it a task it solves with code."
      command: "smolagent \"what is 17 times 23?\" --model-type OpenAIModel --model-id \"$DOZ_MODEL\" --api-base \"$OPENAI_BASE_URL\""
    tips:
    - "`DOZ_MODEL` and `OPENAI_BASE_URL` are set for the key you chose."
    - "Its web-search tools reach the open web only when you allow it."
    docs: https://huggingface.co/docs/smolagents
