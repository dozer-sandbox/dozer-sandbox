- type: com.dozersandbox/launch@1
  config:
    command:
    - tau
    model_args:
    - '--provider'
    - '$DOZ_MODEL_PROVIDER'
    - '-m'
    - '$DOZ_MODEL'
    no_prompts_args: []
    passthrough:
    - --version
    - --help
    - -p
    - --print
    - setup
    - upgrade
    env:
      TAU_NO_UPDATE_CHECK: '1'
      TAU_OFFLINE: '1'
    state_env: {}
    status: none
    verify:
    - argv:
      - tau
      - --version
      expect: ${{ kit.args.version }}
    check:
      argv:
      - tau
      - -p
      - say ok
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: 'Tau''s own providers (its catalogue), each reading its key from the environment; Dozer puts the provider and model on its command line (--provider xai -m grok-build-0.1 on xAI, the default).'
      checked: '2026-10-16'
    - kind: api-key
      provider: anthropic
      accounts:
      - api-key
      keys_page: https://console.anthropic.com/settings/keys
      note: 'Tau through Anthropic: doz try tau --provider anthropic (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: openai
      accounts:
      - openai-key
      keys_page: https://platform.openai.com/api-keys
      note: 'Tau through OpenAI: doz try tau --provider openai (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: google
      accounts:
      - key
      keys_page: https://aistudio.google.com/apikey
      note: 'Tau through Google AI: doz try tau --provider google (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: openrouter
      accounts:
      - key
      keys_page: https://openrouter.ai/keys
      note: 'Tau through OpenRouter: doz try tau --gateway openrouter (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
    - kind: api-key
      provider: vercel-ai-gateway
      accounts:
      - key
      keys_page: https://vercel.com/docs/ai-gateway/authentication-and-byok
      note: 'Tau through Vercel AI Gateway: doz try tau --gateway vercel-ai-gateway (or choose it in the try setup); the model with --model.'
      checked: '2026-10-16'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: verified
      evidence: 'make recipe-check: its check turn through a stand-in OpenRouter (doz try with --gateway openrouter; models@1)'
      checked: '2026-10-16'
    - gateway: vercel-ai-gateway
      level: verified
      evidence: 'make recipe-check: its check turn through a stand-in Vercel AI Gateway (doz try with --gateway vercel-ai-gateway; models@1)'
      checked: '2026-10-16'
- type: com.dozersandbox/models@1
  config:
    default: xai
    native:
    - source: anthropic
      env:
        DOZ_MODEL_PROVIDER: 'anthropic'
        DOZ_MODEL: '${{ dozer.model }}'
    - source: openai
      env:
        DOZ_MODEL_PROVIDER: 'openai'
        DOZ_MODEL: '${{ dozer.model }}'
    - source: xai
      env:
        DOZ_MODEL_PROVIDER: 'xai'
        DOZ_MODEL: '${{ dozer.model }}'
    - source: google
      env:
        DOZ_MODEL_PROVIDER: 'google'
        DOZ_MODEL: '${{ dozer.model }}'
    - source: openrouter
      env:
        DOZ_MODEL_PROVIDER: 'openrouter'
        DOZ_MODEL: '${{ dozer.model }}'
      docs: https://github.com/huggingface/tau/blob/v0.4.7/website/content/guides/providers-and-models.md
    - source: vercel-ai-gateway
      env:
        DOZ_MODEL_PROVIDER: 'vercel-ai-gateway'
        DOZ_MODEL: '${{ dozer.model }}'
      docs: https://github.com/huggingface/tau/blob/v0.4.7/website/content/guides/providers-and-models.md
    models:
      xai: grok-build-0.1
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: coding-agent
    categories:
    - coding-agent
    icon: tau
    default_base: debian
    platforms:
      glibc: true
      musl: false
    tags:
    - tag: headless
      level: verified
      notes:
      - tau -p "…"
      evidence: 'make recipe-check: tau -p "say ok" printed the stand-in''s answer and exited in a fresh try'
      checked: '2026-10-14'
    terms: Your API key of the provider or gateway you choose (xAI by default).
- type: com.dozersandbox/guide@1
  config:
    intro: "Tau is a coding agent with its own screen: the session on the left. Ask it to read, change and run the code in your folder."
    steps:
    - text: "Check it answers, without its screen."
      command: "tau -p \"say ok\""
    - text: "Ask it something in its own screen — the session on the left."
    - text: "One task without its screen."
      command: "tau -p \"list the files in this folder\""
    tips:
    - "Files it makes are in /workspace — your folder on the Mac."
    - "Restart its session from the session's ⋯ menu; End stops it."
    docs: https://github.com/huggingface/tau
