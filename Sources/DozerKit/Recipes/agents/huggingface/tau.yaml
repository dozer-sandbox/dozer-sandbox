# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# Tau — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/tau.json, which Dozer embeds).
schema: 2
kind: workload
id: huggingface/tau
displayName: Tau
description: Hugging Face's Python port of the pi coding agent, on the key of the provider or gateway you choose (xAI by default).
author: Hugging Face
sourceUrl: https://github.com/huggingface/tau
licenses:
- MIT
args:
  version:
    description: The Tau release Dozer installs (its pin).
    default: 0.4.7
    pattern: '[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?'
    buildArg: TAU_VERSION
provides:
- com.dozersandbox/tau@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.anthropic.com:443
      - api.openai.com:443
      - api.x.ai:443
      - generativelanguage.googleapis.com:443
      - openrouter.ai:443
      - ai-gateway.vercel.sh:443
    dozer:
      model:
        id: model:tau
        title: Talk to its model provider
        summary: Tau's model — the provider or gateway its key is for (Anthropic, OpenAI, xAI, Google AI, OpenRouter or Vercel AI Gateway), with an API key. Needed for Tau to answer.
        phrase: talk to your AI model
        hosts:
        - host: api.anthropic.com
          reason: Anthropic — when the sandbox's key is Anthropic's
        - host: api.openai.com
          reason: OpenAI — when the sandbox's key is OpenAI's
        - host: api.x.ai
          paths:
          - /v1/chat/completions
          reason: xAI — when the sandbox's key is xAI's
        - host: generativelanguage.googleapis.com
          reason: Google AI — when the sandbox's key is Google AI's
        - host: openrouter.ai
          reason: OpenRouter — when the sandbox's key is OpenRouter's
        - host: ai-gateway.vercel.sh
          reason: Vercel AI Gateway — when the sandbox's key is Vercel AI Gateway's
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
- type: com.docker.sandbox/volume@1
  config:
    path: /home/agent/.tau
- type: com.dozersandbox/install@1
  config:
    kind: pypi
    package: tau-ai
    binary: tau
    integrity: sha512-d4WAekaGnc6sVNtqtN57wIGdKTbGa/EsnvCPa2rKShDZ5u/UmycxtREaYLqCW7QRkW7WygD2slaHwb5SbNBe9Q==
    requirements:
    - annotated-doc==0.0.5 --hash=sha256:117bac03a25ede5df5440e855b32d556049ca169ead221505badf432fed4b101
    - annotated-types==0.8.0 --hash=sha256:f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0
