- type: com.dozersandbox/launch@1
  config:
    command:
    - adk
    no_prompts_args: []
    passthrough:
    - '--version'
    - '--help'
    env:
      GOOGLE_GENAI_USE_VERTEXAI: FALSE
    state_env: {}
    session: shell
    status: none
    verify:
    - argv:
      - adk
      - '--version'
      expect: '${{ kit.args.version }}'
    check:
      argv:
      - sh
      - '-c'
      - cd "$(mktemp -d)" && mkdir hello && echo 'from . import agent' > hello/__init__.py && printf 'from google.adk.agents import Agent\nroot_agent = Agent(name="hello", model="gemini-2.5-flash", instruction="Answer briefly.")\n' > hello/agent.py && printf 'say ok\nexit\n' | adk run hello
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: google
      accounts:
      - key
      keys_page: https://aistudio.google.com/apikey
      note: 'ADK''s agents call the Gemini API through Google''s genai SDK, which reads GEMINI_API_KEY (GOOGLE_GENAI_USE_VERTEXAI=FALSE: the API key, never Vertex AI). Agents you write choose their model (gemini-2.5-flash).'
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: unknown
      reason: not checked against Agent Development Kit
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: unknown
      reason: not checked against Agent Development Kit
      checked: '2026-10-14'
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: ai-tool
    categories:
    - framework
    icon: adk
    default_base: debian
    platforms:
      glibc: true
      musl: false
    tags:
    - tag: headless
      level: verified
      notes:
      - echo PROMPT | adk run AGENT_DIR
      evidence: 'A2 VM proof: its check turn answered DOZ_FAKE_OK through the fake provider (make recipe-check; probes/617-*/recipes/adk)'
      checked: '2026-10-14'
    terms: Your Gemini API key — a key from aistudio.google.com. adk web (its dev UI) and adk api_server need a forwarded port, which Dozer does not offer yet.
- type: com.dozersandbox/guide@1
  config:
    intro: "Google's Agent Development Kit builds agents in Python; `adk run FOLDER` talks to one in the terminal."
    steps:
    - text: "Check it answers: a one-file agent in a temporary folder."
      command: "cd \"$(mktemp -d)\" && mkdir hello && echo 'from . import agent' > hello/__init__.py && printf 'from google.adk.agents import Agent\\nroot_agent = Agent(name=\"hello\", model=\"gemini-2.5-flash\", instruction=\"Answer briefly.\")\\n' > hello/agent.py && printf 'say ok\\nexit\\n' | adk run hello"
    - text: "See its commands."
      command: "adk --help"
    tips:
    - "An agent is a Python package folder whose agent module defines `root_agent`."
    - "`adk web` (its dev UI) needs a forwarded port."
    docs: https://google.github.io/adk-docs/
