# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# Agent Development Kit — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/adk.json, which Dozer embeds).
schema: 2
kind: workload
id: google/adk
displayName: Agent Development Kit
description: Google's framework for building agents in Python, with its adk command (run an agent in the terminal), on a Gemini API key.
author: Google
sourceUrl: https://github.com/google/adk-python
licenses:
- Apache-2.0
args:
  version:
    description: The Agent Development Kit release Dozer installs (its pin).
    default: '2.12.0'
    pattern: '[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?'
    buildArg: ADK_VERSION
provides:
- com.dozersandbox/adk@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - generativelanguage.googleapis.com:443
    dozer:
      model:
        id: model:adk
        title: Talk to Google AI
        summary: Agent Development Kit's model (the Gemini API, with an API key) — needed for Agent Development Kit to answer.
        phrase: talk to your AI model (Google AI)
        hosts:
        - host: generativelanguage.googleapis.com
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: Google AI (Gemini API) API access
  config:
    service: google
    phase: runtime
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
      - domain: generativelanguage.googleapis.com
        header: x-goog-api-key
        format: '%s'
    dozer:
      accounts:
      - key
- type: com.dozersandbox/install@1
  config:
    kind: pypi
    package: google-adk
    binary: adk
    integrity: sha512-76G+COIXjWA72IGkBmebzttRgvC4sQQrRljMlVD95eL1Af6VeJXYNJMZvGg8hx9fWEI87M5RCNnFrojYvs1wiw==
