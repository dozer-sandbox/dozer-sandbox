# yaml-language-server: $schema=../../../../../schema/dozer-recipe-2.schema.json
# clai (Pydantic AI) — Dozer's recipe (schema 2). The format: docs/recipes/RECIPE-FORMAT.md.
# Edit this file, then run make recipes (it writes Recipes/compiled/clai.json, which Dozer embeds).
schema: 2
kind: workload
id: pydantic/clai
displayName: clai (Pydantic AI)
description: Pydantic AI's command line for chatting with models, on an xAI API key.
author: Pydantic
sourceUrl: https://github.com/pydantic/pydantic-ai
licenses:
- MIT
args:
  version:
    description: The clai (Pydantic AI) release Dozer installs (its pin).
    default: '2.55.0'
    pattern: '[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?'
    buildArg: CLAI_VERSION
provides:
- com.dozersandbox/clai@${{ kit.args.version }}
capabilities:
- type: com.docker.sandbox/network-policy@1
  config:
    runtime:
      allow:
      - api.x.ai:443
    dozer:
      model:
        id: model:clai
        title: Talk to xAI
        summary: clai (Pydantic AI)'s model (the xAI API, with an API key) — needed for clai (Pydantic AI) to answer.
        phrase: talk to your AI model (xAI)
        hosts:
        - host: api.x.ai
      update: []
      excluded: []
- type: com.docker.sandbox/credential@1
  description: xAI API access
  config:
    service: xai
    phase: runtime
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
      - domain: api.x.ai
        header: authorization
        format: Bearer %s
    dozer:
      accounts:
      - key
      env_aliases:
      - OPENAI_API_KEY
- type: com.dozersandbox/install@1
