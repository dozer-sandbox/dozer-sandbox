- type: com.dozersandbox/launch@1
  config:
    command:
    - clai
    - '-m'
    - openai:grok-4-1-fast
    no_prompts_args: []
    passthrough:
    - '--version'
    - '--help'
    - '-h'
    env:
      OPENAI_BASE_URL: https://api.x.ai/v1
    state_env: {}
    status: none
    verify:
    - argv:
      - clai
      - '--version'
      expect: '${{ kit.args.version }}'
    check:
      argv:
      - clai
      - '-m'
      - openai:grok-4-1-fast
      - '--no-stream'
      - say ok
      expect: DOZ_FAKE_OK
- type: com.dozersandbox/auth@1
  config:
    methods:
    - kind: api-key
      provider: xai
      accounts:
      - key
      keys_page: https://console.x.ai/
      note: 'clai speaks to xAI through Pydantic AI''s OpenAI provider: OPENAI_BASE_URL is xAI''s API and the xAI key''s placeholder is also OPENAI_API_KEY; the session starts it with -m openai:grok-4-1-fast (its own xai: provider needs the xai-sdk package, which is not installed). Its other providers are not offered here yet.'
      checked: '2026-10-14'
- type: com.dozersandbox/gateways@1
  config:
    entries:
    - gateway: openrouter
      level: unknown
      reason: not checked against clai (Pydantic AI)
      checked: '2026-10-14'
    - gateway: vercel-ai-gateway
      level: unknown
      reason: not checked against clai (Pydantic AI)
      checked: '2026-10-14'
- type: com.dozersandbox/currency@1
  config:
    checked: '2026-10-14'
- type: com.dozersandbox/directory@1
  config:
    kind: ai-tool
    categories:
    - terminal-tool
    icon: clai
    default_base: debian
    platforms:
      glibc: true
      musl: false
    tags:
    - tag: headless
      level: verified
      notes:
      - clai -m openai:MODEL PROMPT
      evidence: 'A2 VM proof: its check turn answered DOZ_FAKE_OK through the fake provider (make recipe-check; probes/617-*/recipes/clai)'
      checked: '2026-10-14'
    terms: Your xAI API key — a key from console.x.ai.
- type: com.dozersandbox/guide@1
  config:
    intro: "clai is Pydantic AI's command line: its session on the left is a chat, and `clai` with a prompt answers once."
    steps:
    - text: "Check it answers."
      command: "clai -m openai:grok-4-1-fast --no-stream \"say ok\""
    - text: "Chat in its session on the left."
    - text: "One question."
      command: "clai -m openai:grok-4-1-fast --no-stream \"what is a sandbox, in one line?\""
    tips:
    - "Its model is fixed in the session's command (`-m openai:grok-4-1-fast`)."
    docs: https://ai.pydantic.dev/cli/
